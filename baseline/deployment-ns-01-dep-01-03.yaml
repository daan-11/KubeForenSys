apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-01-03
  namespace: ns-01
  labels:
    app: app-01-03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-01-03
  template:
    metadata:
      labels:
        app: app-01-03
    spec:
      serviceAccountName: default
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
