apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-02-06
  namespace: ns-02
  labels:
    app: app-02-06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-02-06
  template:
    metadata:
      labels:
        app: app-02-06
    spec:
      serviceAccountName: default
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
