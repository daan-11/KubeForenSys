apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-ns-07-allow-from-app-07-01-to-app-07-02
  namespace: ns-07
spec:
  podSelector:
    matchLabels:
      app: app-07-02
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: app-07-01
  policyTypes:
  - Ingress
