apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-ns-05-allow-from-app-05-01-to-app-05-02
  namespace: ns-05
spec:
  podSelector:
    matchLabels:
      app: app-05-02
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: app-05-01
  policyTypes:
  - Ingress
