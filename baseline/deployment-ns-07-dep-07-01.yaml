apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-07-01
  namespace: ns-07
  labels:
    app: app-07-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-07-01
  template:
    metadata:
      labels:
        app: app-07-01
    spec:
      serviceAccountName: default
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
