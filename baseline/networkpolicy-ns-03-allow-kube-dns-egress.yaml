apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-ns-03-allow-kube-dns-egress
  namespace: ns-03
spec:
  podSelector: {}  # all pods
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  policyTypes:
  - Egress
